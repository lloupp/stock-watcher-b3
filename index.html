<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stock Watcher B3 — dashboard de ações da B3 em tempo real">
  <title>Stock Watcher B3</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header__inner">
      <div class="header__logo">
        <span class="logo-icon" aria-hidden="true">📈</span>
        <div class="logo-text">
          <h1>Stock Watcher<span class="logo-suffix"> B3</span></h1>
          <p class="header__subtitle">Cotações da B3 em tempo real</p>
        </div>
      </div>
      <div class="header__status" id="market-status" title="Status do mercado">
        <span class="status-dot"></span>
        <span class="status-text">Carregando…</span>
      </div>
    </div>
  </header>

  <!-- ===== Busca ===== -->
  <section class="search">
    <div class="search__inner">
      <div class="search__box">
        <span class="search__icon" aria-hidden="true">🔍</span>
        <input
          type="text"
          id="search-input"
          class="search__input"
          placeholder="Buscar por ticker ou nome (ex: PETR4, Petrobras)…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Buscar ativo"
        >
        <button id="search-clear" class="search__clear" type="button" aria-label="Limpar busca" title="Limpar busca">✕</button>
      </div>
      <button id="search-btn" class="search__btn" type="button">Buscar</button>
    </div>
  </section>

  <!-- ===== Fase 6: Barra de filtros ===== -->
  <section class="filters" id="filters-bar" aria-label="Filtros e ordenação">
    <div class="filters__inner">
      <!-- Variação: todos / gainers / losers -->
      <div class="filter-group" role="group" aria-label="Filtro por variação" id="filter-variation">
        <button type="button" class="filter-chip is-active" data-variation="all">
          Todos <span class="filter-badge" aria-hidden="true">0</span>
        </button>
        <button type="button" class="filter-chip filter-chip--gain" data-variation="gainers">
          <span aria-hidden="true">▲</span> Altas <span class="filter-badge" aria-hidden="true">0</span>
        </button>
        <button type="button" class="filter-chip filter-chip--loss" data-variation="losers">
          <span aria-hidden="true">▼</span> Baixas <span class="filter-badge" aria-hidden="true">0</span>
        </button>
      </div>

      <div class="filter-group filter-group--end">
        <!-- Setor -->
        <div class="filter-select">
          <span class="filter-select__icon" aria-hidden="true">🏭</span>
          <select id="filter-sector" class="filter-select__el" aria-label="Filtrar por setor">
            <option value="">Todos os setores</option>
          </select>
        </div>
        <!-- Ordenação -->
        <div class="filter-select">
          <span class="filter-select__icon" aria-hidden="true">↕</span>
          <select id="filter-sort" class="filter-select__el" aria-label="Ordenar por">
            <option value="default">Padrão</option>
          </select>
        </div>
        <!-- Reset -->
        <button type="button" id="filter-reset" class="filter-reset" hidden title="Limpar todos os filtros">
          ✕ Limpar filtros
        </button>
      </div>
    </div>
  </section>

  <!-- ===== Grid de cards ===== -->
  <main class="main">
    <div class="main__inner">
      <div class="main__header">
        <div class="main__tabs" id="view-tabs" role="tablist" aria-label="Visualização">
          <button type="button" class="main__tab is-active" role="tab" aria-selected="true" data-view="popular">
            <span class="tab-icon" aria-hidden="true">🔥</span> Populares
          </button>
          <button type="button" class="main__tab" role="tab" aria-selected="false" data-view="watchlist">
            <span class="tab-icon" aria-hidden="true">⭐</span> Watchlist
            <span class="tab-badge" id="watchlist-count" hidden>0</span>
          </button>
        </div>
        <div class="main__meta" id="grid-meta"></div>
      </div>

      <!-- Toolbar de watchlist: adicionar por ticker + limpar -->
      <div id="watchlist-toolbar" class="watchlist-toolbar" hidden>
        <div class="watchlist-add">
          <span class="watchlist-add__icon" aria-hidden="true">＋</span>
          <input
            type="text"
            id="watchlist-input"
            class="watchlist-add__input"
            placeholder="Adicionar ticker (ex: PETR4, VALE3)…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Adicionar ticker à watchlist"
          >
          <button id="watchlist-add-btn" class="watchlist-add__btn" type="button">Adicionar</button>
        </div>
        <button id="watchlist-clear" class="watchlist-clear" type="button" aria-label="Limpar watchlist" title="Remover todos os ativos da watchlist">
          Limpar
        </button>
      </div>

      <h2 class="main__title" id="grid-title">Ações populares</h2>

      <!-- Loading state (Fase 2 preencherá com dados reais; a Fase 1 exibe skeleton) -->
      <div id="cards-grid" class="cards-grid" aria-live="polite">
        <!-- Cards renderizados dinamicamente por app.js -->
      </div>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-icon">📭</span>
        <p><span class="empty-title">Nenhum ativo encontrado.</span><span class="empty-sub"></span></p>
      </div>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="footer__inner">
      <p>Dados fornecidos por
        <a href="https://brapi.dev" target="_blank" rel="noopener">brapi.dev</a> — API gratuita, sem token.
      </p>
      <p>Feito com 💙 · 100% client-side ·
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
      </p>
    </div>
  </footer>

  <!-- ===== Modal (placeholder — Fase 5 preencherá com gráfico detalhado) ===== -->
  <div id="modal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__content" id="modal-content"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
